<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is It PE?</title>
  <meta name="description" content="Check whether an NYC restaurant or food business is owned by private equity.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Is it <span class="accent">PE</span>?</h1>
    <p class="tagline">Check who owns the places you eat in New York City.</p>
  </header>

  <main>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <label for="q" class="visually-hidden">Restaurant or business name</label>
      <input id="q" name="q" type="search" placeholder="Try “Levain” or “Dunkin”" autofocus>
      <button type="submit">Check</button>
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>

    <section id="result" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
